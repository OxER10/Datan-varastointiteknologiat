services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: company
      POSTGRES_PASSWORD: company
      POSTGRES_DB: company
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"

  adminer:
    image: adminer
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data: